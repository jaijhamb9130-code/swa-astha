<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description"
        content="Swa-Astha - Your trusted digital healthcare companion for secure patient management and healthcare services.">
    <title>Swa-Astha | Digital Healthcare</title>

    <!-- React CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="styles.css?v=v16">
</head>

<body>
    <div id="pin-overlay"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #008080; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: 'Segoe UI', sans-serif;">
        <h1 style="margin-bottom: 30px;">Security Access</h1>
        <p>Enter your 6-digit Passkey</p>
        <input type="password" id="pin-input" maxlength="6"
            style="padding: 15px; font-size: 2rem; border-radius: 10px; border: none; text-align: center; width: 200px; color: #333; letter-spacing: 5px;"
            placeholder="******" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="none" data-gramm="false">
        <button onclick="checkPin()"
            style="margin-top: 20px; padding: 10px 30px; border-radius: 5px; border: none; background: #ff7f50; color: white; font-weight: bold; cursor: pointer;">Enter
            App</button>
        <p id="pin-error" style="color: #ffcccc; margin-top: 15px; display: none;">Invalid Passkey. Please try again.
        </p>
    </div>

    <script>
        function checkPin() {
            const pin = document.getElementById('pin-input').value;
            if (pin === '123456') {
                document.getElementById('pin-overlay').style.display = 'none';
                localStorage.setItem('swa_asth_access', 'true');
            } else {
                document.getElementById('pin-error').style.display = 'block';
            }
        }
        // Auto-unlock if already entered in this session
        if (localStorage.getItem('swa_asth_access') === 'true') {
            document.getElementById('pin-overlay').style.display = 'none';
        }
    </script>

    <div id="root"></div>

    <!-- Modular Components -->
    <script type="text/babel" src="components/Icons.jsx?v=v16"></script>
    <script type="text/babel" src="components/AppLogo.jsx?v=v16"></script>
    <script type="text/babel" src="components/InputField.jsx?v=v16"></script>
    <script type="text/babel" src="components/BottomNav.jsx?v=v16"></script>
    <script type="text/babel" src="components/ServiceCard.jsx?v=v16"></script>
    <script type="text/babel" src="components/CategoryCard.jsx?v=v16"></script>
    <script type="text/babel" src="components/SideMenu.jsx?v=v16"></script>
    <script type="text/babel" src="components/UIHelpers.jsx?v=v16"></script>

    <!-- Context -->
    <script type="text/babel" src="context/AppContext.jsx?v=2026-05-25-build5"></script>
 
    <!-- Screen Components -->
    <script type="text/babel" src="slides/SplashScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/SignUpScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/SignInScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/HomeScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/ReportsScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/PharmacyScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/BillsScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/InsuranceScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/ProfileScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/HealthResearchScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/DoctorSignUpScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/DoctorSignInScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/DoctorDashboard.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/DoctorVisitsScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/ChatRoomScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/MyOrdersScreen.jsx?v=2026-05-25-build5"></script>
    <script type="text/babel" src="slides/NearbyPharmaciesScreen.jsx?v=2026-05-25-build5"></script>

    <!-- Main App -->
    <script type="text/babel">
        // ============================================
        // NOTIFICATION TOAST COMPONENT (Enhanced)
        // ============================================
        const NotificationToast = () => {
            const { notification } = window.useApp();
            if (!notification) return null;

            // Handle both old string format and new object format
            const message = typeof notification === 'string' ? notification : notification.message;
            const type = typeof notification === 'string' ? 'info' : notification.type;

            const getIcon = () => {
                switch (type) {
                    case 'success': return '✓';
                    case 'error': return '✕';
                    default: return 'ℹ';
                }
            };

            return (
                <div className="toast-container">
                    <div className={`toast ${type}`}>
                        <span className="toast-icon">{getIcon()}</span>
                        <span className="toast-message">{message}</span>
                    </div>
                </div>
            );
        };


        // ============================================
        // DOWNLOAD TOAST STACK COMPONENT
        // ============================================
        const DownloadToastStack = () => {
            const { downloads } = window.useApp();
            if (!downloads || downloads.length === 0) return null;

            return (
                <div className="dl-toast-stack">
                    {downloads.map((dl, idx) => (
                        <div key={dl.id}
                            className={`dl-toast ${dl.status} ${dl.status === 'exiting' ? 'dl-toast-exit' : 'dl-toast-enter'}`}
                            style={{ transitionDelay: `${idx * 40}ms` }}>
                            <div className="dl-toast-icon-wrap">
                                {dl.status === 'downloading' && (
                                    <svg className="dl-spinner" viewBox="0 0 36 36">
                                        <circle className="dl-spinner-track" cx="18" cy="18" r="14" />
                                        <circle className="dl-spinner-fill" cx="18" cy="18" r="14"
                                            strokeDasharray={`${(dl.progress / 100) * 88} 88`} />
                                    </svg>
                                )}
                                {dl.status === 'complete' && (
                                    <div className="dl-check-circle">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                            <polyline points="6 12 10 16 18 8" />
                                        </svg>
                                    </div>
                                )}
                                {dl.status === 'exiting' && (
                                    <div className="dl-check-circle">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                                            <polyline points="6 12 10 16 18 8" />
                                        </svg>
                                    </div>
                                )}
                            </div>
                            <div className="dl-toast-body">
                                <span className="dl-toast-title">
                                    {dl.status === 'complete' || dl.status === 'exiting' ? 'Download Complete' : 'Downloading...'}
                                </span>
                                <span className="dl-toast-file">{dl.fileName}</span>
                                {dl.status === 'downloading' && (
                                    <div className="dl-toast-bar">
                                        <div className="dl-toast-bar-fill" style={{ width: `${dl.progress}%` }} />
                                    </div>
                                )}
                            </div>
                            <span className="dl-toast-pct">
                                {dl.status === 'downloading' ? `${Math.round(dl.progress)}%` : '✓'}
                            </span>
                        </div>
                    ))}
                </div>
            );
        };

        const CartBar = () => {
            const { cart, currentScreen, cartOpen, toggleCart } = window.useApp();
            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const subtotal = cart.reduce((sum, item) => sum + (item.numPrice * item.qty), 0);

            // Only show on pharmacy screen when cart has items and modal is closed
            if (currentScreen !== 'pharmacy' || totalItems === 0 || cartOpen) return null;

            return (
                <div className="ph-cart-bar animate-slide-up" onClick={() => toggleCart(true)}>
                    <div className="ph-cb-content">
                        <div className="ph-cb-left">
                            <span className="ph-cb-icon">🛒</span>
                            <div className="ph-cb-info">
                                <span className="ph-cb-count">{totalItems} {totalItems === 1 ? 'item' : 'items'}</span>
                                <span className="ph-cb-price">Total: ₹{subtotal}</span>
                            </div>
                        </div>
                        <button className="ph-cb-btn">
                            View Cart <span className="ph-cb-arrow">→</span>
                        </button>
                    </div>
                </div>
            );
        };

        const CartScreen = () => {
            const { cart, cartOpen, toggleCart, updateQty, removeItem, clearCart, placeOrder, address, setAddress, showNotification, navigateTo } = window.useApp();
            const [checkoutStep, setCheckoutStep] = React.useState('cart');
            const [addressVal, setAddressVal] = React.useState(address || '');
            const [addressError, setAddressError] = React.useState('');
            const Icons = window.Icons;

            const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
            const subtotal = cart.reduce((sum, item) => sum + (item.numPrice * item.qty), 0);
            const deliveryFee = subtotal > 500 || totalItems === 0 ? 0 : 40;
            const totalAmount = subtotal + deliveryFee;

            if (!cartOpen) return null;

            const handleNext = () => {
                if (checkoutStep === 'cart') {
                    if (totalItems === 0) {
                        showNotification('Your cart is empty', 'info');
                        return;
                    }
                    setCheckoutStep('delivery');
                } else if (checkoutStep === 'delivery') {
                    if (!addressVal.trim()) {
                        setAddressError('Please enter your delivery address');
                        return;
                    }
                    if (addressVal.trim().length < 10) {
                        setAddressError('Address is too short. Please provide full details.');
                        return;
                    }
                    setAddressError('');
                    setAddress(addressVal);
                    setCheckoutStep('review');
                } else if (checkoutStep === 'review') {
                    if (placeOrder(addressVal)) {
                        setCheckoutStep('cart');
                        toggleCart(false);
                        setTimeout(() => navigateTo('pharmacy'), 1500);
                    }
                }
            };

            const handleBack = () => {
                setAddressError('');
                if (checkoutStep === 'delivery') setCheckoutStep('cart');
                else if (checkoutStep === 'review') setCheckoutStep('delivery');
                else toggleCart(false);
            };

            const stepTitle = checkoutStep === 'cart' ? '🛒 My Cart' : checkoutStep === 'delivery' ? '📍 Delivery Address' : '✅ Confirm Order';

            return (
                <div className="cs-fullscreen">
                    {/* Header */}
                    <div className="cs-header">
                        <button className="cs-back-btn" onClick={handleBack}>
                            <Icons.Back />
                        </button>
                        <h1 className="cs-title">{stepTitle}</h1>
                        {totalItems > 0 && <span className="cs-badge">{totalItems}</span>}
                    </div>

                    {/* Stepper */}
                    <div className="cs-stepper">
                        {['Cart', 'Address', 'Review'].map((step, i) => {
                            const stepKeys = ['cart', 'delivery', 'review'];
                            const currentIdx = stepKeys.indexOf(checkoutStep);
                            const isDone = i < currentIdx;
                            const isActive = i === currentIdx;
                            return (
                                <React.Fragment key={step}>
                                    <div className={`cs-step ${isActive ? 'active' : ''} ${isDone ? 'done' : ''}`}>
                                        <div className="cs-step-circle">{isDone ? '✓' : i + 1}</div>
                                        <span className="cs-step-label">{step}</span>
                                    </div>
                                    {i < 2 && <div className={`cs-step-line ${isDone ? 'done' : ''}`}></div>}
                                </React.Fragment>
                            );
                        })}
                    </div>

                    {/* Content */}
                    <div className="cs-content">
                        {/* STEP 1: Cart Items */}
                        {checkoutStep === 'cart' && (
                            <div className="cs-pane animate-fade-in">
                                {cart.length === 0 ? (
                                    <div className="cs-empty">
                                        <div className="cs-empty-icon">🛒</div>
                                        <h3>Your Cart is Empty</h3>
                                        <p>Browse medicines and add them to your cart</p>
                                        <button className="cs-browse-btn" onClick={() => toggleCart(false)}>Browse Medicines</button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="cs-items-list">
                                            {cart.map((item, idx) => (
                                                <div key={(item.batchId || item.name) + '_' + idx} className="cs-item-card">
                                                    <div className="cs-item-icon-wrap">💊</div>
                                                    <div className="cs-item-body">
                                                        <div className="cs-item-top">
                                                            <h4 className="cs-item-name">{item.name}</h4>
                                                            <button className="cs-item-del" onClick={() => removeItem(item.name)}>
                                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                            </button>
                                                        </div>
                                                        {item.pharmacyName ? (
                                                            <div style={{
                                                                display:'flex', alignItems:'center', flexWrap:'wrap', gap:6, marginTop:2,
                                                                background:'#f0fdf9', borderRadius:8, padding:'4px 8px',
                                                                border:'1px solid #d1f0ee', fontSize:11
                                                            }}>
                                                                <span style={{fontWeight:700, color:'#0f172a'}}>🏪 {item.pharmacyName}</span>
                                                                {item.distanceKm && (
                                                                    <span style={{color:'#0d9488', fontWeight:600}}>
                                                                        • 📍 {item.distanceKm} km
                                                                    </span>
                                                                )}
                                                                {item.mapsHref && (
                                                                    <a href={item.mapsHref} target="_blank" rel="noopener noreferrer"
                                                                       style={{marginLeft:'auto', color:'#0d9488', textDecoration:'none', fontWeight:600}}>
                                                                       🗺️ Maps
                                                                    </a>
                                                                )}
                                                            </div>
                                                        ) : (
                                                            <span className="cs-item-cat">{item.category?.name || 'Medicine'}</span>
                                                        )}
                                                        <p className="cs-item-use">{item.use}</p>
                                                        <div className="cs-item-bottom">
                                                            <span className="cs-item-price">₹{(item.numPrice || 0) * item.qty}</span>
                                                            <div className="cs-qty-ctrl">
                                                                <button className="cs-qty-btn" onClick={() => updateQty(item.name, -1)} disabled={item.qty <= 1}>−</button>
                                                                <span className="cs-qty-val">{item.qty}</span>
                                                                <button className="cs-qty-btn" onClick={() => updateQty(item.name, 1)}>+</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        {/* Continue Shopping Link */}
                                        <div className="cs-continue-shopping" onClick={() => toggleCart(false)}>
                                            <span className="cs-continue-icon">←</span>
                                            <span>Continue Shopping</span>
                                        </div>

                                        <div className="cs-summary-card">
                                            <h4 className="cs-summary-title">📋 Order Summary</h4>
                                            <div className="cs-summary-row"><span>Items ({totalItems})</span><span>₹{subtotal}</span></div>
                                            <div className="cs-summary-row"><span>Delivery</span><span className={deliveryFee === 0 ? 'cs-free' : ''}>{deliveryFee === 0 ? 'FREE' : `₹${deliveryFee}`}</span></div>
                                            {subtotal < 500 && subtotal > 0 && (
                                                <div className="cs-upsell">🎁 Add ₹{500 - subtotal} more for <b>FREE Delivery</b></div>
                                            )}
                                            <div className="cs-summary-divider"></div>
                                            <div className="cs-summary-row cs-total"><span>Total</span><span>₹{totalAmount}</span></div>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* STEP 2: Delivery Address */}
                        {checkoutStep === 'delivery' && (
                            <div className="cs-pane animate-fade-in">
                                <div className="cs-addr-card">
                                    <div className="cs-addr-hdr">
                                        <span className="cs-addr-icon">🏠</span>
                                        <div>
                                            <h3>Delivery Address</h3>
                                            <p>Where should we deliver your medicines?</p>
                                        </div>
                                    </div>
                                    <div className={`cs-addr-input-wrap ${addressError ? 'has-error' : ''}`}>
                                        <textarea
                                            className="cs-addr-textarea"
                                            value={addressVal}
                                            onChange={e => { setAddressVal(e.target.value); setAddressError(''); }}
                                            placeholder="House No, Street name, Landmark, City, Pincode"
                                            rows={4}
                                            spellCheck="false"
                                            autoComplete="off"
                                            autoCorrect="off"
                                            autoCapitalize="none"
                                            data-gramm="false"
                                        />
                                        {addressError && (
                                            <div className="cs-addr-error">
                                                <span>⚠️</span> {addressError}
                                            </div>
                                        )}
                                    </div>
                                    <div className="cs-del-option">
                                        <span className="cs-del-icon">⚡</span>
                                        <div className="cs-del-info">
                                            <span className="cs-del-label">Standard Delivery</span>
                                            <span className="cs-del-time">30-60 mins</span>
                                        </div>
                                        <span className="cs-del-price">FREE</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* STEP 3: Review */}
                        {checkoutStep === 'review' && (
                            <div className="cs-pane animate-fade-in">
                                <div className="cs-review-card">
                                    <div className="cs-review-section">
                                        <div className="cs-review-hdr"><span>📍</span><h4>Delivery To</h4></div>
                                        <p className="cs-review-addr">{addressVal}</p>
                                        <button className="cs-change-btn" onClick={() => setCheckoutStep('delivery')}>Change</button>
                                    </div>
                                </div>
                                <div className="cs-review-card">
                                    <div className="cs-review-section">
                                        <div className="cs-review-hdr"><span>💊</span><h4>Medicines ({totalItems})</h4></div>
                                        {cart.map(item => (
                                            <div key={item.name} className="cs-review-item">
                                                <span>{item.name} × {item.qty}</span>
                                                <span>₹{item.numPrice * item.qty}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="cs-review-card">
                                    <div className="cs-summary-row"><span>Subtotal</span><span>₹{subtotal}</span></div>
                                    <div className="cs-summary-row"><span>Delivery</span><span>{deliveryFee === 0 ? 'FREE' : `₹${deliveryFee}`}</span></div>
                                    <div className="cs-summary-divider"></div>
                                    <div className="cs-summary-row cs-total"><span>Total to Pay</span><span>₹{totalAmount}</span></div>
                                </div>
                                <div className="cs-payment-note">
                                    <span>💳</span>
                                    <p>Payment collected at time of delivery (Cash/UPI)</p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Fixed Footer */}
                    {totalItems > 0 && (
                        <div className="cs-footer">
                            {checkoutStep === 'cart' ? (
                                <>
                                    <button className="cs-footer-add-more" onClick={() => toggleCart(false)}>
                                        <span>+ Add More</span>
                                    </button>
                                    <button className={`cs-footer-btn`} onClick={handleNext}>
                                        Proceed <span className="cs-btn-arrow">→</span>
                                    </button>
                                </>
                            ) : (
                                <>
                                    <div className="cs-footer-total">
                                        <span className="cs-footer-label">Amount Payable</span>
                                        <span className="cs-footer-val">₹{totalAmount}</span>
                                    </div>
                                    <button className={`cs-footer-btn ${checkoutStep === 'review' ? 'cs-place-order' : ''}`} onClick={handleNext}>
                                        {checkoutStep === 'delivery' ? 'Continue' : '🎉 Place Order'}
                                        <span className="cs-btn-arrow">→</span>
                                    </button>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        const App = () => {
            const { currentScreen, isModalOpen, cartOpen } = window.useApp();

            // Screens that should NOT show the bottom navigation
            const hideNavScreens = ['splash', 'signup', 'signin', 'doctor-signup', 'doctor-signin', 'doctor-dashboard', 'chat-room'];
            const showNav = !hideNavScreens.includes(currentScreen) && !isModalOpen && !cartOpen;

            const renderScreen = () => {
                switch (currentScreen) {
                    case 'splash': return <window.SplashScreen />;
                    case 'signup': return <window.SignUpScreen />;
                    case 'signin': return <window.SignInScreen />;
                    case 'home': return <window.HomeScreen />;
                    case 'reports': return <window.ReportsScreen />;
                    case 'pharmacy': return <window.PharmacyScreen />;
                    case 'bills': return <window.BillsScreen />;
                    case 'insurance': return <window.InsuranceScreen />;
                    case 'profile': return <window.ProfileScreen />;
                    case 'health-research': return <window.HealthResearchScreen />;
                    case 'doctor-signup': return <window.DoctorSignUpScreen />;
                    case 'doctor-signin': return <window.DoctorSignInScreen />;
                    case 'doctor-dashboard': return <window.DoctorDashboard />;
                    case 'doctor-visits': return <window.DoctorVisitsScreen />;
                    case 'chat-room': return <window.ChatRoomScreen />;
                    case 'my-orders': return <window.MyOrdersScreen />;
                    case 'nearby-pharmacies': return <window.NearbyPharmaciesScreen />;
                    default: return <window.SplashScreen />;
                }
            };

            return (
                <div className="app-container">
                    <div key={currentScreen}
                        className={`screen-wrapper ${currentScreen === 'health-research' ? 'animate-slide-up' : 'animate-fade-in'}`}>
                        {renderScreen()}
                    </div>
                    <CartBar />
                    <CartScreen />
                    {showNav && <window.BottomNav activeTab={currentScreen} />}
                    <NotificationToast />
                    <DownloadToastStack />
                </div>
            );
        };

        // ============================================
        // RENDER APP
        // ============================================
        root.render(
            <window.AppProvider>
                <App />
            </window.AppProvider>
        );
    </script>
</body>

</html>
